<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 智联论坛 · 移动端原型 v2</title>
<style>
/* ============ §1.2 调色板 token（双主题，三态规则） ============ */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFECE4; --surface-3:#E7E3D9;
  --ink:#1B2434; --ink-2:#57606E; --ink-3:#828C9B; --line:#E4E0D6;
  --brand:#1F3A5F; --brand-2:#2B5FA8; --brand-soft:#E4ECF5;
  --accent:#E8A33D; --accent-strong:#C07A10; --accent-soft:#FBF0DC; --accent-ink:#6B4309;
  --danger:#D64541; --success:#2F7D50;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161D; --surface:#1A2029; --surface-2:#212936; --surface-3:#293343;
    --ink:#E9ECF2; --ink-2:#A6B0C0; --ink-3:#78839A; --line:#333E4F;
    --brand:#5B8DCC; --brand-2:#7FA8DC; --brand-soft:#22334A;
    --accent:#E8A33D; --accent-strong:#E8A33D; --accent-soft:#3A2C14; --accent-ink:#F0C886;
    --danger:#E3655F; --success:#4CA075;
  }
}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --surface-2:#212936; --surface-3:#293343;
  --ink:#E9ECF2; --ink-2:#A6B0C0; --ink-3:#78839A; --line:#333E4F;
  --brand:#5B8DCC; --brand-2:#7FA8DC; --brand-soft:#22334A;
  --accent:#E8A33D; --accent-strong:#E8A33D; --accent-soft:#3A2C14; --accent-ink:#F0C886;
  --danger:#E3655F; --success:#4CA075;
}
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans CJK SC",-apple-system,"Segoe UI",sans-serif;
  background:#0E1420 radial-gradient(1200px 700px at 18% -6%, rgba(43,95,168,.28), transparent 60%),
              radial-gradient(900px 620px at 88% 108%, rgba(232,163,61,.14), transparent 55%), #0E1420;
  display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden;
  color:var(--ink);
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;color:inherit}
svg{display:block}
/* ============ §1.4 手机框 ============ */
.phone{
  width:390px;height:844px;max-height:94vh;background:var(--bg);
  border-radius:46px;overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.65),0 0 0 10px #1A1F2B,0 0 0 12px #2A3243;
}
/* 连接点阵母题（极淡径向渐变网格） */
.phone::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle, var(--brand) 1px, transparent 1.2px);
  background-size:26px 26px;opacity:.055;
}
@media (max-width:430px){
  body{background:var(--bg)}
  .phone{width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}
}
/* ============ 状态栏 / 导航栏 / Tab / FAB ============ */
.statusbar{
  height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 30px;font-size:14px;font-weight:600;position:relative;z-index:5;color:var(--ink);
}
.statusbar .sicons{display:flex;align-items:center;gap:6px}
.navbar{
  height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;
  position:relative;z-index:5;
}
.navbar .ntitle{flex:1;text-align:center;font-size:16.5px;font-weight:700;letter-spacing:.02em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.navbar .nbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--ink)}
.navbar .nbtn:active{background:var(--surface-2)}
.navbar .nbtn.placeholder{visibility:hidden}
.tabbar{
  flex:none;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:var(--surface);border-top:1px solid var(--line);position:relative;z-index:5;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--ink-3);min-height:44px;position:relative}
.tab.on{color:var(--brand);font-weight:600}
.tab .dot{position:absolute;top:8px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--accent-strong);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;font-variant-numeric:tabular-nums}
.fab{
  position:absolute;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;
  width:54px;height:54px;border-radius:50%;background:var(--accent-strong);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px -6px rgba(192,122,16,.55);transition:transform .15s;
}
.fab:active{transform:scale(.92)}
/* ============ 页面容器 ============ */
#view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;overscroll-behavior:contain}
#view::-webkit-scrollbar{width:0}
.page{animation:pageIn .24s ease;padding:0 0 24px}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
/* ============ 通用组件 ============ */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;margin:10px 16px 4px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .18s}
.seg button.on{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(31,58,95,.28)}
.card{background:var(--surface);border-radius:16px;margin:10px 12px;padding:14px 14px 10px;border:1px solid var(--line);transition:transform .12s}
.card:active{transform:scale(.985)}
.prow{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.avatar.sm{width:30px;height:30px;font-size:12px}
.avatar.lg{width:64px;height:64px;font-size:24px;border-radius:22px}
.pname{font-size:13.5px;font-weight:600}
.pmeta{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--brand-soft);color:var(--brand)}
.chip.pin{background:var(--accent-soft);color:var(--accent-ink)}
.chip.ess{background:#F3E4F0;color:#8A3B7E}
:root[data-theme="dark"] .chip.ess{background:#33222F;color:#D9A5CC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.ess{background:#33222F;color:#D9A5CC}}
.ptitle{font-size:15.5px;font-weight:700;line-height:1.42;margin:8px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pabstract{font-size:13px;color:var(--ink-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pacts{display:flex;align-items:center;margin-top:8px;border-top:1px solid var(--line);padding-top:4px}
.pact{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:44px;font-size:12.5px;color:var(--ink-2);border-radius:10px;font-variant-numeric:tabular-nums}
.pact:active{background:var(--surface-2)}
.pact.on{color:var(--accent-strong);font-weight:600}
.pact.on.heart{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--brand);color:#fff}
.btn.acc{background:var(--accent-strong);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:34px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.empty{padding:56px 32px;text-align:center;color:var(--ink-2)}
.empty .eicon{width:72px;height:72px;margin:0 auto 14px;border-radius:24px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.empty .etitle{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.empty .edesc{font-size:12.5px;line-height:1.6;margin-bottom:16px}
.listend{text-align:center;font-size:11.5px;color:var(--ink-3);padding:18px 0 6px;font-variant-numeric:tabular-nums}
.divider{height:8px;background:var(--surface-2);margin:6px 0}
.sheetmask{position:absolute;inset:0;background:rgba(12,16,24,.45);z-index:20;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 0 calc(14px + env(safe-area-inset-bottom));animation:sheetUp .26s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--surface-3);margin:4px auto 10px}
.sheet .stitle{font-size:15px;font-weight:700;text-align:center;padding:0 20px 10px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:12px 20px;font-size:14.5px;text-align:left}
.sitem:active{background:var(--surface-2)}
.sitem .sic{color:var(--ink-2)}
.sitem.danger{color:var(--danger)} .sitem.danger .sic{color:var(--danger)}
.sitem .sub{font-size:11.5px;color:var(--ink-2);display:block;margin-top:2px}
.toast{
  position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13px;z-index:40;
  animation:toastIn .25s cubic-bezier(.2,.9,.3,1);white-space:nowrap;max-width:86%;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 8px 22px rgba(0,0,0,.3);
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){
  .page,.sheet,.toast,.fab,.card,.btn{animation:none!important;transition:none!important}
}
</style>
<style>
/* ============ 帖子详情 / 评论树 ============ */
.detail{padding:14px 16px 90px}
.dtitle{font-size:20px;font-weight:800;line-height:1.4;margin:10px 0}
.dmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.dbar{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.dbar .cinput{flex:1;height:40px;background:var(--surface-2);border-radius:12px;padding:0 14px;font-size:13.5px;display:flex;align-items:center;color:var(--ink-3);border:none;outline:none}
.dbar .cinput:focus{color:var(--ink)}
.dbar .sbtn{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.dbar .login-tip{flex:1;height:40px;background:var(--surface-2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--brand);font-weight:600}
.dacts{display:flex;gap:10px;margin:16px 0 4px}
.dacts .btn{flex:1;height:42px;font-size:13px}
.md{font-size:14.5px;line-height:1.75;color:var(--ink);word-break:break-word;margin-top:12px}
.md p{margin:0 0 10px}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:6px}
.md pre{background:#1B2434;color:#E6EDF7;border-radius:14px;padding:14px;margin:10px 0;overflow-x:auto;font-size:12.5px;line-height:1.6}
.md pre code{background:none;padding:0;color:inherit}
.md a{color:var(--brand-2);text-decoration:none;border-bottom:1px dashed var(--brand-2)}
.md strong{font-weight:700}
.md img{max-width:100%;border-radius:12px;margin:6px 0}
.md blockquote{border-left:3px solid var(--accent);padding:2px 12px;color:var(--ink-2);margin:8px 0;background:var(--accent-soft);border-radius:0 10px 10px 0}
.chead{font-size:14px;font-weight:700;margin:18px 0 4px;font-variant-numeric:tabular-nums}
.comment{padding:12px 0;border-top:1px solid var(--line)}
.comment .cbody{font-size:13.5px;line-height:1.65;margin:6px 0 4px}
.comment .cmeta{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);align-items:center}
.comment .cmeta button{font-size:11.5px;color:var(--ink-2);min-height:28px;display:inline-flex;align-items:center;gap:4px}
.comment .floor{color:var(--ink-3);font-variant-numeric:tabular-nums}
.replies{margin:4px 0 0 16px;padding-left:12px;border-left:2px solid var(--surface-3)}
.replies .comment{border-top:none;padding:8px 0}
.collapse-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--brand-2);font-weight:600;min-height:36px;margin-left:16px}
.cdeleted{color:var(--ink-3);font-size:12.5px;font-style:normal;background:var(--surface-2);border-radius:8px;padding:6px 10px;display:inline-block}
@keyframes hlFade{0%{background:var(--accent-soft)}100%{background:transparent}}
.hl{animation:hlFade 1.6s ease forwards;border-radius:10px}
/* ============ 板块 / 话题 ============ */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 14px;transition:transform .12s}
.bcard:active{transform:scale(.96)}
.bcard .bicon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:#fff}
.bcard .bname{font-size:14.5px;font-weight:700}
.bcard .bmeta{font-size:11px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.trow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:8px 12px;padding:13px 14px;min-height:44px}
.trow:active{transform:scale(.98)}
.thash{width:34px;height:34px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.fbtn{flex:none;height:30px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.fbtn.on{background:var(--brand-soft);color:var(--brand)}
.tchips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.tchips::-webkit-scrollbar{display:none}
.tchips .fbtn{height:32px;white-space:nowrap}
/* ============ 通知 / 私信 / 会话 ============ */
.nitem{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);min-height:44px;position:relative;background:var(--surface)}
.nitem:active{background:var(--surface-2)}
.nitem .nicon{width:36px;height:36px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
.nitem .ntext{font-size:13.5px;line-height:1.5}
.nitem .ntime{font-size:11px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.unread-dot{position:absolute;left:6px;top:20px;width:7px;height:7px;border-radius:50%;background:var(--accent-strong)}
.nbar{display:flex;justify-content:flex-end;padding:6px 16px 0}
.nbar button{font-size:12px;color:var(--brand-2);font-weight:600;min-height:32px}
.chatwrap{display:flex;flex-direction:column;height:100%}
.chatlist{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:74%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.55;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
.msg.other{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.chatbar{flex:none;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.chatbar input{flex:1;height:40px;background:var(--surface-2);border:none;border-radius:12px;padding:0 14px;font-size:13.5px;outline:none;color:var(--ink)}
/* ============ 我的 / 资料 / 设置 ============ */
.pcard{background:var(--surface);margin:12px;border-radius:18px;padding:18px 16px;border:1px solid var(--line)}
.pcard .pbio{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.pstats{display:flex;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.pstat{flex:1;text-align:center}
.pstat b{font-size:16px;font-variant-numeric:tabular-nums}
.pstat span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:2px}
.mrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:8px 12px;padding:0 14px;min-height:52px;font-size:14px;font-weight:500;width:calc(100% - 24px);text-align:left}
.mrow:active{background:var(--surface-2)}
.mrow .mic{color:var(--ink-2)}
.mrow .tail{margin-left:auto;color:var(--ink-3);font-size:12px;display:flex;align-items:center;gap:6px}
.mbadge{background:var(--accent-strong);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-variant-numeric:tabular-nums}
.role-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;vertical-align:2px;margin-left:6px}
.role-tag.admin{background:var(--accent-soft);color:var(--accent-ink)}
.role-tag.mod{background:var(--brand-soft);color:var(--brand)}
.field{margin:12px 16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--brand-2)}
.field textarea{min-height:120px;resize:vertical;line-height:1.6}
/* ============ 认证页 ============ */
.auth{min-height:100%;display:flex;flex-direction:column;padding:26px 26px 30px}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#1F3A5F,#2B5FA8);display:flex;align-items:center;justify-content:center;margin:18px 0 16px;box-shadow:0 10px 24px -8px rgba(31,58,95,.5)}
.auth h1{font-size:23px;font-weight:800;letter-spacing:.02em}
.auth .asub{font-size:13px;color:var(--ink-2);margin:8px 0 26px;line-height:1.7}
.idpick{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.idrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:44px;text-align:left}
.idrow.on{border-color:var(--brand);background:var(--brand-soft)}
.idrow .iname{font-size:14px;font-weight:600}
.idrow .idesc{font-size:11px;color:var(--ink-2);margin-top:2px}
/* ============ 举报 / 处理 ============ */
.radioitem{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 20px;font-size:14px;width:100%;text-align:left}
.radioitem:active{background:var(--surface-2)}
.rdot{width:19px;height:19px;border-radius:50%;border:2px solid var(--ink-3);flex:none;position:relative}
.radioitem.on .rdot{border-color:var(--brand)}
.radioitem.on .rdot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand)}
.report-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:10px 12px;padding:14px}
.report-card .rstatus{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px}
.rstatus.pending{background:var(--accent-soft);color:var(--accent-ink)}
.rstatus.resolved{background:#E3EFE7;color:var(--success)}
.rstatus.dismissed{background:var(--surface-2);color:var(--ink-2)}
:root[data-theme="dark"] .rstatus.resolved{background:#1C2E25}

  body:'把社团知识库项目里踩过的坑整理成一篇。\n\n**分块**：固定 512 token 容易切断语义，建议按标题层级递归切：\n\n```python\ndef split_md(text, max_len=512):\n    chunks, buf = [], ""\n    for line in text.split("\\n"):\n        if len(buf) + len(line) > max_len:\n            chunks.append(buf); buf = ""\n        buf += line + "\\n"\n    return chunks\n```\n\n**评估**：别只看召回率，`hit_rate@5` 和人工抽检 50 条都要做。详细清单见文末链接。'},

<script>

const store={
 get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
 del:(k)=>{try{localStorage.removeItem(k)}catch(e){}},
};
const S={
 user:null,            // null=游客；否则为 users 项
 theme:store.get('ia2.theme','system'),

 feedTab:'all', boardTab:'boards', notifTab:'notif', meTab:'posts',

};

const isGuest=()=>!S.user;
const isMod=()=>S.user&&(S.user.role==='moderator'||S.user.role==='admin');
const isAdmin=()=>S.user&&S.user.role==='admin';
const canManage=p=>S.user&&(isMod()||p.author===S.user.id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=sel=>document.querySelector(sel);
/* ================= 主题（§5.8 三态） ================= */
function applyTheme(){
 document.documentElement.removeAttribute('data-theme');
 if(S.theme==='light')document.documentElement.setAttribute('data-theme','light');
 if(S.theme==='dark')document.documentElement.setAttribute('data-theme','dark');
 store.set('ia2.theme',S.theme);
}
/* ================= Toast / Sheet ================= */
function toast(msg){
 const t=document.createElement('div');t.className='toast';t.textContent=msg;
 $('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),250)},2100);
}
function openSheet(html){
 closeSheet();
 const ov=$('#overlay');
 const m=document.createElement('div');m.className='sheetmask';m.onclick=closeSheet;
 const s=document.createElement('div');s.className='sheet';s.innerHTML='<div class="grab"></div>'+html;
 ov.appendChild(m);ov.appendChild(s);
}
function closeSheet(){$('#overlay').innerHTML='';}
/* ================= 路由（§5.1：hash + History API） ================= */
function nav(path){location.hash='#'+path;}
function back(){history.back();}
function route(){
 const raw=(location.hash||'#/feed').slice(1);
 const [path,qs]=raw.split('?');
 const q={};(qs||'').split('&').forEach(kv=>{const[k,v]=kv.split('=');if(k)q[k]=decodeURIComponent(v||'')});
 window.scrollTo(0,0);$('#view').scrollTop=0;
 let m;
 if(path==='/login')return renderLogin();
 if(path==='/register')return renderRegister();
 if(path==='/feed')return renderFeed();
 if(path==='/boards')return renderBoards();
 if(path==='/notifications')return renderNotif();
 if(path==='/me')return renderMe();
 if(path==='/write')return renderWrite();
 if(path==='/settings')return renderSettings();
 if(path==='/profile-edit')return renderProfileEdit();

/* ================= Markdown-lite（§5.2：先转义再渲染） ================= */
function md(src){
 let s=esc(src);
 const blocks=[];
 s=s.replace(/```(\w*)\n([\s\S]*?)```/g,(_,lang,code)=>{blocks.push(`<pre><code>${code.replace(/\n$/,'')}</code></pre>`);return "\x00"+(blocks.length-1)+"\x00";});
 s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
 s=s.replace(/(https?:\/\/[^\s]+\.(?:png|jpe?g|gif|webp))/g,'<img src="$1" alt="图片">');
 s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
 s=s.split(/\n{2,}/).map(p=>p.trim()?`<p>${p.replace(/\n/g,'<br>')}</p>`:'').join('');
 s=s.replace(/\x00(\d+)\x00/g,(_,i)=>blocks[+i]);
 return `<div class="md">${s}</div>`;
}

function avatar(u,cls=''){return `<span class="avatar ${cls}" style="background:${u.color}">${esc(u.name[0])}</span>`;}
function plain(s){return String(s).replace(/```[\s\S]*?```/g,'[代码]').replace(/\*\*([^*]+)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/(https?:\/\/\S+)/g,'').replace(/\n+/g,' ');}

 if(u.role==='moderator')return '<span class="role-tag mod">副社长</span>';return '';

function empty(iconName,title,desc,btn){
 return `<div class="empty"><div class="eicon">${icon(iconName,32)}</div><div class="etitle">${title}</div><div class="edesc">${desc}</div>${btn||''}</div>`;

function seg(items,cur,fn){
 return `<div class="seg">${items.map(([k,label])=>`<button class="${cur===k?'on':''}" onclick="${fn}('${k}')">${label}</button>`).join('')}</div>`;

function sortedPosts(list){

 const a=U(p.author),b=B(p.board),t=p.topic?T(p.topic):null;
 frame('帖子详情',{right:`<button class="nbtn" onclick="moreSheet('${p.id}')" aria-label="更多">${icon('more')}</button>`});
 const tops=DB.comments.filter(c=>c.post===pid&&!c.parent);
 const total=DB.comments.filter(c=>c.post===pid&&!c.deleted).length;
 // §5.2：通知锚点 → 渲染前预展开祖先链，渲染后定位高亮
 const anchor=q.c||S._keep;S._keep=null;
 if(anchor){
  let c=DB.comments.find(x=>x.id===anchor.replace('cmt-',''));
  while(c&&c.parent){S.expanded.add('x_'+c.parent);c=DB.comments.find(x=>x.id===c.parent);}
 }
 let html=`<div class="detail">
  <div class="prow"><span onclick="nav('/user/${a.id}')" style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer">${avatar(a)}<div><div class="pname">${esc(a.name)}${roleTag(a)}</div><div class="pmeta">${p.time} · ${esc(b.name)}</div></div></span></div>
  <div class="chips">${p.pinned?'<span class="chip pin">置顶</span>':''}${p.essence?'<span class="chip ess">精华</span>':''}<span class="chip">${esc(b.name)}</span>${t?`<span class="chip"># ${esc(t.name)}</span>`:''}</div>
  <div class="dtitle">${esc(p.title)}</div>
  ${md(p.body)}
  <div class="dacts">
   <button class="btn ghost" style="${p.liked?'color:var(--danger);font-weight:600':''}" onclick="toggleLike('${p.id}')">${icon('heart',18)}${p.liked?'已赞':'点赞'} ${p.likes}</button>
   <button class="btn ghost" style="${p.faved?'color:var(--accent-strong);font-weight:600':''}" onclick="toggleFav('${p.id}')">${icon('star',18)}${p.faved?'已收藏':'收藏'} ${p.favs}</button>
   <button class="btn ghost" onclick="toast('分享链接已复制（演示）')">${icon('share',18)}分享</button>
  </div>
  <div class="chead">评论 ${total}</div>
  ${tops.length?tops.map((c,i)=>commentHtml(c,p,i+1)).join(''):empty('comment','还没有评论','来抢沙发','')}
 </div>`;
 $('#view').innerHTML=`<div class="page">${html}</div>`;
 // 底部评论栏（§5.1：FAB 已隐藏，避免遮挡）
 const bar=document.createElement('div');bar.className='dbar';bar.id='dbar';
 bar.innerHTML=isGuest()
  ?`<button class="login-tip" onclick="requireAuth('/post/${pid}')">登录后参与评论</button>`
  :`<input class="cinput" id="cinput" placeholder="写下你的评论…" data-post="${pid}"><button class="sbtn" onclick="sendComment('${pid}')" aria-label="发送">${icon('send',18)}</button>`;
 $('#phone').appendChild(bar);
 // 锚点定位 + 高亮 1.6s（§5.2）
 if(anchor){
  requestAnimationFrame(()=>{const el=document.getElementById(anchor.startsWith('cmt-')?anchor:'cmt-'+anchor);
   if(el){el.scrollIntoView({block:'center'});el.classList.add('hl');}});
 }
}
function sendComment(pid){
 const inp=$('#cinput');const text=inp.value.trim();
 if(!text){toast('先说点什么吧');return;}
 DB.comments.push({id:'c'+Date.now(),post:pid,author:S.user.id,parent:inp.dataset.reply||null,time:'刚刚',body:text,deleted:false});
 inp.value='';delete inp.dataset.reply;toast('评论已发布');route();
}
/* ================= L2 发帖（草稿 localStorage 持久化，§5.3） ================= */
const DRAFT_KEY=()=> 'ia2.draft.'+(S.user?S.user.id:'guest');
function renderWrite(){
 if(!requireAuth('/write'))return;
 frame('发帖',{right:`<button class="btn sm acc" style="margin-right:8px" onclick="publishPost()">发布</button>`});
 const d=store.get(DRAFT_KEY(),null);
 S.draftBoard=d&&d.board||null;S.draftTopic=d&&d.topic||null;
 $('#view').innerHTML=`<div class="page">
  <div class="field"><label>板块（必选）</label><button class="btn ghost block" style="justify-content:space-between" onclick="boardPicker()"><span id="wBoard">${S.draftBoard?esc(B(S.draftBoard).name):'选择板块'}</span>${icon('back',16).replace('M15 5l-7 7 7 7','M9 5l7 7-7 7')}</button></div>
  <div class="field"><label>话题（可选）</label><button class="btn ghost block" style="justify-content:space-between" onclick="topicPicker()"><span id="wTopic">${S.draftTopic?esc(T(S.draftTopic).name):S.draftBoard?'选择话题':'先选板块'}</span>${icon('back',16).replace('M15 5l-7 7 7 7','M9 5l7 7-7 7')}</button></div>
  <div class="field"><label>标题</label><input id="wTitle" placeholder="一句话说清楚" value="${d?esc(d.title):''}" oninput="saveDraft()"></div>
  <div class="field"><label>正文（支持 Markdown 子集：代码块 / 行内代码 / 粗体 / 链接 / 外链图片，§5.2）</label><textarea id="wBody" placeholder="正文…" style="min-height:200px" oninput="saveDraft()">${d?esc(d.body):''}</textarea></div>
  <div style="padding:0 16px;display:flex;gap:10px"><button class="btn ghost" style="flex:1" onclick="clearDraft()">清空草稿</button></div>
 </div>`;
 if(d&&(d.title||d.body))toast('已恢复上次草稿');
}
function saveDraft(){
 const t=($('#wTitle')||{}).value??'',b=($('#wBody')||{}).value??'';
 store.set(DRAFT_KEY(),{title:t,body:b,board:S.draftBoard,topic:S.draftTopic,ts:Date.now()});
}
function clearDraft(){store.del(DRAFT_KEY());S.draftBoard=S.draftTopic=null;route();toast('草稿已清空');}
function boardPicker(){
 openSheet(`<div class="stitle">选择板块</div>${DB.boards.map(b=>`<button class="sitem" onclick="pickBoard('${b.id}')"><span class="sic" style="color:${b.color}">${icon(b.icon)}</span><div>${esc(b.name)}<span class="sub">${esc(b.desc)}</span></div></button>`).join('')}`);
}
function pickBoard(bid){S.draftBoard=bid;S.draftTopic=null;saveDraft();closeSheet();route();}
function topicPicker(){
 if(!S.draftBoard){toast('请先选择板块');return;}
 const ts=DB.topics.filter(t=>t.board===S.draftBoard);
 openSheet(`<div class="stitle">选择话题（从属所选板块，自动过滤）</div>
  <button class="sitem" onclick="pickTopic('')"><span class="sic">${icon('x')}</span>不选话题</button>
  ${ts.map(t=>`<button class="sitem" onclick="pickTopic('${t.id}')"><span class="sic">${icon('chat')}</span># ${esc(t.name)}</button>`).join('')}`);
}
function pickTopic(tid){S.draftTopic=tid||null;saveDraft();closeSheet();route();}
function publishPost(){
 const title=$('#wTitle').value.trim(),body=$('#wBody').value.trim();
 if(!S.draftBoard){toast('请选择板块（必填）');return;}
 if(!title){toast('请填写标题');return;}
 if(!body){toast('正文不能为空');return;}
 const id='p'+Date.now();
 DB.posts.unshift({id,board:S.draftBoard,topic:S.draftTopic,author:S.user.id,title,pinned:false,essence:false,time:'刚刚',likes:0,favs:0,liked:false,faved:false,body});
 store.del(DRAFT_KEY());S.draftBoard=S.draftTopic=null;
 toast('发布成功');nav('/post/'+id);
}
</script>
<script>
"use strict";
/* ================= 登录引导页（Q8：通知/我的 Tab 原地展示，非跳转） ================= */
function guestWall(iconName,title,desc){
 return `<div class="page">${empty(iconName,title,desc+'<br>登录后可继续使用，取消则留在当前浏览位置（Q8）',`<button class="btn pri" onclick="requireAuth(currentPath())">去登录</button>`)}</div>`;
}
/* ================= L1 通知 / 私信 ================= */
const NICON={like:['heart','#F3E0E0','#D64541'],comment:['comment','#E4ECF5','#2B5FA8'],reply:['chat','#E4ECF5','#2B5FA8'],follow:['user','#E3EFE7','#2F7D50'],report_result:['shield','#FBF0DC','#C07A10']};
function renderNotif(){
 frame('通知');
 if(isGuest()){$('#view').innerHTML=guestWall('bell','登录后查看通知','点赞、评论、关注与举报结果都会在这里通知你');return;}
 let html=seg([['notif','通知'],['msg','私信']],S.notifTab,'setNotifTab');
 if(S.notifTab==='notif'){
  const unread=DB.notifications.filter(n=>!n.read).length;
  html+=unread?`<div class="nbar"><button onclick="readAll()">全部已读（${unread}）</button></div>`:'';
  html+=DB.notifications.length?DB.notifications.map(n=>{
   const [ic,bgc,fgc]=NICON[n.type];const from=n.from?U(n.from):null;
   return `<div class="nitem" onclick="openNotif('${n.id}')">${n.read?'':'<span class="unread-dot"></span>'}
    <span class="nicon" style="background:${bgc};color:${fgc}">${icon(ic,18)}</span>
    <div style="flex:1"><div class="ntext">${from?`<b>${esc(from.name)}</b> `:''}${esc(n.text)}</div><div class="ntime">${n.time}</div></div></div>`;}).join('')
   :empty('bell','暂时没有新通知','互动消息会出现在这里');
 }else{
  html+=DB.convos.length?DB.convos.map(cv=>{const peer=U(cv.peer);const last=cv.msgs[cv.msgs.length-1];
   return `<div class="nitem" onclick="nav('/chat/${peer.id}')">${avatar(peer)}
    <div style="flex:1"><div class="pname">${esc(peer.name)}${roleTag(peer)}</div><div class="ntext" style="color:var(--ink-2);font-size:12.5px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:250px">${esc(last.text)}</div></div>
    <div class="ntime">${last.time}</div></div>`;}).join('')
   :empty('chat','还没有私信会话','到用户主页发起第一次对话');
 }
 $('#view').innerHTML=`<div class="page">${html}</div>`;
}
function setNotifTab(k){S.notifTab=k;route();}
function readAll(){DB.notifications.forEach(n=>n.read=true);toast('已全部标记为已读');route();}
function openNotif(id){
 const n=DB.notifications.find(x=>x.id===id);n.read=true;
 if(n.type==='follow')return nav('/user/'+n.from);
 if(n.type==='report_result'){toast('举报处理结果：已完成');return route();}
 if(n.post)return nav('/post/'+n.post+(n.comment?'?c='+n.comment:''));
 route();
}
/* ================= L2 私信会话（id=对方用户 id，§5.4） ================= */
function renderChat(peerId){
 if(!requireAuth('/chat/'+peerId))return;
 const peer=U(peerId);if(!peer)return nav('/notifications');
 frame(esc(peer.name));
 let cv=DB.convos.find(c=>c.peer===peerId);
 if(!cv){cv={peer:peerId,msgs:[]};DB.convos.push(cv);}   // 首次发起自动建会话
 $('#view').innerHTML=`<div class="chatwrap"><div class="chatlist" id="chatlist">
  ${cv.msgs.length?cv.msgs.map(m=>`<div class="msg ${m.from===S.user.id?'me':'other'}">${esc(m.text)}</div>`).join(''):empty('chat','开始对话吧','和 '+esc(peer.name)+' 的第一条消息') }
 </div></div>`;
 const bar=document.createElement('div');bar.className='chatbar';
 bar.innerHTML=`<input id="chatInput" placeholder="发消息…" onkeydown="if(event.key==='Enter')sendMsg('${peerId}')"><button class="sbtn" style="width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;border:none" onclick="sendMsg('${peerId}')">${icon('send',18)}</button>`;
 $('#phone').appendChild(bar);
 const cl=$('#chatlist');cl.scrollTop=cl.scrollHeight;
}
function sendMsg(peerId){
 const inp=$('#chatInput');const text=inp.value.trim();if(!text)return;
 DB.convos.find(c=>c.peer===peerId).msgs.push({from:S.user.id,text,time:'刚刚'});
 inp.value='';route();
 requestAnimationFrame(()=>{const cl=$('#chatlist');if(cl)cl.scrollTop=cl.scrollHeight;});
}
/* ================= L1 我的 / L2 用户主页（复用 Profile 组件） ================= */
function profileCard(u,self){
 const posts=DB.posts.filter(p=>p.author===u.id).length;
 const favs=self&&!isGuest()?(DB.favorites[u.id]||[]).length:0;
 const fol=self&&!isGuest()?((DB.follows[u.id]||{users:[],boards:[],topics:[]})):null;
 const followed=!isGuest()&&(DB.follows[S.user.id]||{users:[]}).users.includes(u.id);
 return `<div class="pcard">
  <div class="prow">${avatar(u,'lg')}<div style="flex:1"><div style="font-size:17px;font-weight:800">${esc(u.name)}${roleTag(u)}${u.banned?'<span class="role-tag" style="background:var(--danger);color:#fff">已封禁</span>':''}</div><div class="pmeta" style="margin-top:3px">${self?'这是我的主页':'TA 的主页'}</div></div></div>
  <div class="pbio">${esc(u.bio)}</div>
  <div class="pstats"><div class="pstat"><b>${posts}</b><span>帖子</span></div>${self?`<div class="pstat"><b>${favs}</b><span>收藏</span></div><div class="pstat"><b>${fol.users.length+fol.boards.length+fol.topics.length}</b><span>关注</span></div>`:'<div class="pstat"><b>—</b><span>收藏</span></div><div class="pstat"><b>—</b><span>关注</span></div>'}</div>
  ${self?'':`<div style="display:flex;gap:10px;margin-top:14px">
   <button class="btn ${followed?'ghost':'pri'}" style="flex:1" onclick="followUser('${u.id}')">${followed?'已关注':'关注'}</button>
   <button class="btn ghost" style="flex:1" onclick="if(requireAuth('/chat/${u.id}'))nav('/chat/${u.id}')">${icon('chat',17)} 私信</button>
   <button class="btn ghost" style="width:46px;flex:none;padding:0" onclick="userMore('${u.id}')">${icon('more',18)}</button></div>`}
 </div>`;
}
function renderMe(){
 frame('我的');
 if(isGuest()){$('#view').innerHTML=guestWall('user','登录后查看个人主页','你的帖子、收藏、关注与管理入口都在这里');return;}
 const u=S.user;
 const pending=DB.reports.filter(r=>r.status==='pending').length;
 let html=profileCard(u,true);
 html+=`<button class="mrow" onclick="nav('/profile-edit')"><span class="mic">${icon('pencil',19)}</span>编辑资料<span class="tail">${icon('back',15).replace('M15 5l-7 7 7 7','M9 5l7 7-7 7')}</span></button>`;
 html+=`<button class="mrow" onclick="nav('/settings')"><span class="mic">${icon('gear',19)}</span>设置<span class="tail">${icon('back',15).replace('M15 5l-7 7 7 7','M9 5l7 7-7 7')}</span></button>`;
 if(isMod())html+=`<button class="mrow" onclick="nav('/reports')"><span class="mic">${icon('shield',19)}</span>举报处理<span class="tail">${pending?`<span class="mbadge">${pending}</span>`:''} 仅 moderator/admin 可见 ${icon('back',15).replace('M15 5l-7 7 7 7','M9 5l7 7-7 7')}</span></button>`;
 html+=`<div class="divider"></div>`;
 html+=seg([['posts','帖子'],['favs','收藏'],['follows','关注']],S.meTab,'setMeTab');
 if(S.meTab==='posts'){
  const mine=sortedPosts(DB.posts.filter(p=>p.author===u.id));
  html+=mine.length?mine.map(postCard).join(''):empty('pencil','还没有发布过帖子','',`<button class="btn acc" onclick="fabGo()">去发帖</button>`);
 }else if(S.meTab==='favs'){
  const favs=(DB.favorites[u.id]||[]).map(P).filter(Boolean);
  html+=favs.length?favs.map(postCard).join(''):empty('star','还没有收藏内容','在帖子里点星标即可收藏');
 }else{
  const f=DB.follows[u.id]||{users:[],boards:[],topics:[]};
  const rows=[
   ...f.users.map(id=>{const x=U(id);return `<div class="trow" onclick="nav('/user/${id}')">${avatar(x,'sm')}<div style="flex:1"><div style="font-size:13.5px;font-weight:600">${esc(x.name)}</div><div class="pmeta">用户</div></div></div>`}),
   ...f.boards.map(id=>{const x=B(id);return `<div class="trow" onclick="nav('/board/${id}')"><span class="thash" style="background:${x.color};color:#fff;border-radius:11px">${icon(x.icon,16)}</span><div style="flex:1"><div style="font-size:13.5px;font-weight:600">${esc(x.name)}</div><div class="pmeta">板块</div></div></div>`}),
   ...f.topics.map(id=>{const x=T(id);return `<div class="trow" onclick="nav('/topic/${id}')"><span class="thash">#</span><div style="flex:1"><div style="font-size:13.5px;font-weight:600">${esc(x.name)}</div><div class="pmeta">话题</div></div></div>`})];
  html+=rows.length?rows.join(''):empty('user','还没有关注任何人/板块/话题','');
 }
 $('#view').innerHTML=`<div class="page">${html}</div>`;
}
function setMeTab(k){S.meTab=k;route();}
function renderUser(uid){
 const u=U(uid);if(!u)return nav('/feed');
 if(S.user&&u.id===S.user.id)return nav('/me');
 frame('用户主页');
 const posts=sortedPosts(DB.posts.filter(p=>p.author===uid));
 let html=profileCard(u,false);
 html+=posts.length?posts.map(postCard).join(''):empty('pencil','TA 还没有发布过帖子','');
 $('#view').innerHTML=`<div class="page">${html}</div>`;
}
function followUser(uid){
 if(!requireAuth())return;
 const f=DB.follows[S.user.id]||(DB.follows[S.user.id]={users:[],boards:[],topics:[]});
 const i=f.users.indexOf(uid);i>=0?f.users.splice(i,1):f.users.push(uid);
 toast(i>=0?'已取消关注':'已关注');route();
}
function userMore(uid){
 const u=U(uid);
 let items=`<button class="sitem" onclick="closeSheet();reportSheet('用户','${uid}')"><span class="sic">${icon('flag')}</span>举报用户</button>`;
 if(isAdmin())items+=`<button class="sitem danger" onclick="closeSheet();confirmDo('${u.banned?'解封':'封禁'} ${esc(u.name)}？','${u.banned?'解封后恢复其全部权限':'封禁后其无法登录与操作（仅 admin，§5.0）'}',()=>{toggleBan('${uid}')})"><span class="sic">${icon('ban')}</span>${u.banned?'解封用户':'封禁用户'}<span class="sub">仅 admin 可见</span></button>`;
 openSheet(`<div class="stitle">${esc(u.name)}</div>${items}`);
}
function toggleBan(uid){
 const u=U(uid);u.banned=!u.banned;
 DB.modActions.push({id:'m'+Date.now(),report:'—',actor:S.user.id,action:u.banned?'封禁用户':'解封用户',note:u.name,time:'刚刚'});
 toast(u.banned?'已封禁':'已解封');route();
}
/* ================= L2 资料编辑 / 设置 ================= */
function renderProfileEdit(){
 if(!requireAuth('/profile-edit'))return;
 frame('编辑资料',{right:`<button class="btn sm pri" style="margin-right:8px" onclick="saveProfile()">保存</button>`});
 const u=S.user;
 $('#view').innerHTML=`<div class="page">
  <div class="field"><label>昵称</label><input id="peName" value="${esc(u.name)}"></div>
  <div class="field"><label>签名 / 简介</label><textarea id="peBio">${esc(u.bio)}</textarea></div>
 </div>`;
}
function saveProfile(){
 const n=$('#peName').value.trim();if(n.length<2){toast('昵称至少 2 个字符');return;}
 S.user.name=n;S.user.bio=$('#peBio').value.trim();toast('已保存');back();
}
function renderSettings(){
 if(!requireAuth('/settings'))return;
 frame('设置');
 const t=S.theme;
 $('#view').innerHTML=`<div class="page">
  <div style="padding:14px 16px 2px;font-size:12px;font-weight:600;color:var(--ink-2)">外观（§5.8 三态，写入 localStorage）</div>
  <div class="seg" style="margin-top:8px">
   <button class="${t==='system'?'on':''}" onclick="setTheme('system')">跟随系统</button>
   <button class="${t==='light'?'on':''}" onclick="setTheme('light')">浅色</button>
   <button class="${t==='dark'?'on':''}" onclick="setTheme('dark')">深色</button>
  </div>
  <div style="padding:14px 16px 2px;font-size:12px;font-weight:600;color:var(--ink-2)">原型演示</div>
  <button class="mrow" onclick="switchRole()"><span class="mic">${icon('user',19)}</span>切换演示角色<span class="tail">当前：${esc(S.user.name)}（${S.user.role}）</span></button>
  <div class="divider"></div>
  <button class="mrow" style="color:var(--danger)" onclick="confirmDo('退出登录？','草稿与主题设置会保留在本地',()=>{S.user=null;closeSheet();nav('/feed');toast('已退出')})"><span class="mic" style="color:var(--danger)">${icon('lock',19)}</span>退出登录</button>
 </div>`;
}
function setTheme(t){S.theme=t;applyTheme();route();}
function switchRole(){
 openSheet(`<div class="stitle">切换演示角色（§5.0 矩阵可见性）</div>
  ${[['u1','社长 · admin'],['u2','副社长 · moderator'],['u3','成员 · user']].map(([uid,rl])=>{const u=U(uid);return `<button class="sitem" onclick="S.user=U('${uid}');closeSheet();toast('已切换为 ${esc(u.name)}（${rl}）');route()">${avatar(u)}<div>${esc(u.name)}<span class="sub">${rl}</span></div></button>`}).join('')}
  <button class="sitem" onclick="S.user=null;closeSheet();toast('已切换为游客');route()"><span class="sic">${icon('x')}</span>游客（不登录）</button>`);
}
/* ================= L2 举报处理（治理闭环 §5.6） ================= */
function targetDesc(r){
 if(r.targetType==='帖子'){const p=P(r.target);return p?`帖子《${esc(p.title)}》`:'帖子（已删除）';}
 if(r.targetType==='评论'){const c=DB.comments.find(x=>x.id===r.target);return c&&!c.deleted?`评论「${esc(c.body.slice(0,40))}…」`:'评论（已删除）';}
 if(r.targetType==='用户'){const u=U(r.target);return u?`用户 ${esc(u.name)}`:'';}
 return '';
}
function renderReports(){
 if(!isMod()){frame('举报处理');$('#view').innerHTML=`<div class="page">${empty('shield','无权限','仅 moderator/admin 可访问（§5.0）')}</div>`;return;}
 frame('举报处理');
 const sorted=[...DB.reports].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));
 let html=sorted.length?sorted.map(r=>{
  const rp=U(r.reporter);
  const audit=DB.modActions.filter(m=>m.report===r.id);
  return `<div class="report-card">
   <div class="prow" style="justify-content:space-between"><span class="rstatus ${r.status}">${{pending:'待处理',resolved:'已处理',dismissed:'已忽略'}[r.status]}</span><span class="pmeta">${r.time}</span></div>
   <div style="font-size:13.5px;font-weight:600;margin:9px 0 3px">${esc(r.reason)} · ${targetDesc(r)}</div>
   <div class="pmeta">举报人：${esc(rp.name)}${r.note?` · 备注：${esc(r.note)}`:''}</div>
   ${audit.map(m=>`<div class="audit">处理：${esc(m.action)} ｜ 操作人：${esc(U(m.actor).name)} ｜ ${esc(m.note)} ｜ ${m.time}</div>`).join('')}
   ${r.status==='pending'?`<div style="margin-top:10px"><button class="btn sm pri" onclick="handleSheet('${r.id}')">处理</button></div>`:''}
  </div>`;}).join(''):empty('shield','没有待处理的举报','社区一片祥和');
 $('#view').innerHTML=`<div class="page">${html}</div>`;
}
function handleSheet(rid){
 const r=DB.reports.find(x=>x.id===rid);
 const acts=[['忽略举报','dismissed','ghost']];
 if(r.targetType!=='用户')acts.push(['删除内容','delete','danger']);
 acts.push(['警告发布者','warn','danger']);
 if(isAdmin()&&r.targetType!=='用户'){const t=r.targetType==='帖子'?P(r.target):DB.comments.find(x=>x.id===r.target);acts.push(['封禁发布者（仅 admin）','ban','danger']);}
 if(isAdmin()&&r.targetType==='用户')acts.push(['封禁该用户（仅 admin）','ban','danger']);
 openSheet(`<div class="stitle">处理举报 · ${esc(r.reason)}</div>
  <div class="field" style="margin:2px 20px 8px"><input id="handleNote" placeholder="处理备注（将写入审计）"></div>
  ${acts.map(([label,a,cls])=>`<button class="sitem ${cls==='danger'?'danger':''}" onclick="doHandle('${rid}','${a}')"><span class="sic">${icon(a==='dismissed'?'x':a==='delete'?'trash':a==='warn'?'warn':'ban')}</span>${label}</button>`).join('')}`);
}
function doHandle(rid,action){
 const r=DB.reports.find(x=>x.id===rid);
 const note=($('#handleNote')||{}).value||'';
 let label='';
 if(action==='dismissed'){r.status='dismissed';label='已忽略';}
 else{
  r.status='resolved';
  if(action==='delete'){
   if(r.targetType==='帖子'){const p=P(r.target);if(p){DB.posts.splice(DB.posts.indexOf(p),1);}}
   else{const c=DB.comments.find(x=>x.id===r.target);if(c){c.deleted=true;c.body='';}}
   label='删除内容';
  }else if(action==='warn'){label='警告发布者';}
  else if(action==='ban'){
   let uid=r.targetType==='用户'?r.target:(r.targetType==='帖子'?(P(r.target)||{}).author:((DB.comments.find(x=>x.id===r.target)||{}).author));
   const u=U(uid);if(u){u.banned=true;}
   label='封禁发布者';
  }
 }
 DB.modActions.push({id:'m'+Date.now(),report:rid,actor:S.user.id,action:label,note:note||'—',time:'刚刚'});
 // report_result 通知闭环（§5.6）
 DB.notifications.unshift({id:'n'+Date.now(),type:'report_result',from:null,post:null,comment:null,text:`你举报的${r.targetType}已处理：${label}。感谢维护社区秩序。`,time:'刚刚',read:false});
 closeSheet();toast('处理完成，已通知举报人');route();
}
/* ================= 初始化 ================= */
function route$guardClean(){
 // L2 底部输入栏清理（详情/会话页动态挂载）
 document.querySelectorAll('.dbar,.chatbar').forEach(e=>e.remove());
}
const _route=route;
route=function(){route$guardClean();_route();};
applyTheme();
route();
</script>
