# CI/CD（#8 §5.1 + testing.md 确认项）
# - test：go build + go test 必须通过（集成测试用 testcontainers，ubuntu-latest 自带 Docker）
# - lint：golangci-lint 非阻塞（失败不阻断部署，仅提示）
# - deploy：前端 npm ci + build（始终，作构建验证）+ scp 上传 ~/ai-forum/frontend/dist（门控）；
#           后端构建推送 GHCR + SSH 直连 docker compose pull && up -d；未配置 SSH secrets 或 DEPLOY_ENABLED!=true 时跳过上传/部署步，run 不红

name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true # 非阻塞（testing.md 已确认）
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: backend

  frontend-test:
    runs-on: ubuntu-latest
    continue-on-error: true # 过渡（地图 Roadmap 第 2 项）：前端单测先不阻断；连续 5 run 全绿后移除本行转阻塞
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 与 deploy 内前端构建一致（Vite 8.2 engines ^20.19.0 || >=22.12.0）
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

  deploy:
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    concurrency: # 防两次 push 部署互撞（#8 变体：容器 nginx @8888）
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env: # secrets 不能直接用于 if 条件（job/step 级都不行，会导致 workflow 解析失败、run 0 秒报错）
      # 先落到 job 级 env，step 的 if 用 env 上下文判断是否配置了 SSH secrets
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      # 前端（#14）：始终构建，作 main 上的构建验证；上传步按 SSH secrets 门控（与 API 镜像 always-push + gated-deploy 一致）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8.2 engines 要求 ^20.19.0 || >=22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          load: true # A'：镜像同时 load 进 runner 本地 daemon，供下一步 docker save + gzip → scp → 服务器 load（替代服务器 GHCR pull）
          tags: |
            ghcr.io/li-yongqvan/ai-forum-api:latest
            ghcr.io/li-yongqvan/ai-forum-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save and compress API image
        # A'：镜像 save + gzip（~13MB），scp 直传服务器 load；服务器不再从 GHCR 拉（~2.6KB/s 曾超时）
        # 镜像 tag 保持 ghcr.io/li-yongqvan/ai-forum-api:latest，compose.yml 无需改
        # 注：scp-action 的 source 需相对 $GITHUB_WORKSPACE，故输出到 ./api-image.tar.gz
        run: |
          docker save ghcr.io/li-yongqvan/ai-forum-api:latest | gzip -1 > api-image.tar.gz
          ls -lh api-image.tar.gz
      - name: Upload frontend to server
        # scp 直传容器 nginx 静态根（#8 变体：共享服务器无 sudo → ~/ai-forum/frontend/dist，web 容器挂载）
        # strip_components: 2 去掉 frontend/dist 前缀，dist 内容直落 web root
        if: env.SSH_HOST != '' && vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: frontend/dist/*
          target: /home/liyongquan/ai-forum/frontend/dist
          strip_components: 2
      - name: Upload API image to server
        # A'：压缩镜像包 scp 直传服务器 /tmp（走 SSH，同 frontend scp 链路）；服务器 docker load 后 compose up
        if: env.SSH_HOST != '' && vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: api-image.tar.gz
          target: /tmp
      - name: Deploy to server
        # 未配 SSH secrets 或 DEPLOY_ENABLED!=true 时仅跳过部署步；镜像仍正常推 GHCR
        if: env.SSH_HOST != '' && vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/ai-forum
            git pull origin main
            mkdir -p frontend/dist uploads   # 自愈：目录被误删时先以部署用户重建，防 docker 以 root 重建后 scp 写不进
            docker load -i /tmp/api-image.tar.gz   # A'：替代 docker compose pull api（GHCR ~2.6KB/s 曾超时）
            docker compose up -d --force-recreate api   # 确保用新 load 的镜像重建 api 容器
            docker compose exec web nginx -t && docker compose exec web nginx -s reload   # web.conf bind mount 只更新文件不重建容器，需 reload 才生效（评审 Q5）
            docker image prune -f
            docker compose ps
