# CI/CD（#8 §5.1 + testing.md 确认项）
# - test：go build + go test 必须通过（集成测试用 testcontainers，ubuntu-latest 自带 Docker）
# - lint：golangci-lint 非阻塞（失败不阻断部署，仅提示）
# - deploy：SSH 直连服务器 docker compose pull && up -d；未配置 SSH secrets 时跳过，不报失败

name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true # 非阻塞（testing.md 已确认）
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env: # secrets 不能直接用于 if 条件（job/step 级都不行，会导致 workflow 解析失败、run 0 秒报错）
      # 先落到 job 级 env，step 的 if 用 env 上下文判断是否配置了 SSH secrets
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/li-yongqvan/ai-forum-api:latest
            ghcr.io/li-yongqvan/ai-forum-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to server
        # 未配 SSH secrets 时仅跳过部署步；镜像仍正常推 GHCR
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/ai-forum
            git pull origin main
            docker compose pull api
            docker compose up -d api
            docker compose ps
